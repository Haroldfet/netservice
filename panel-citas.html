<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel de Citas - NetService Pro</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="panel-citas" data-rol="admin">
<!-- BARRA SUPERIOR (la genera js/app.js) -->
<header id="topbar"></header>
<!-- CONTENIDO PRINCIPAL -->
<main class="wrap">
<!-- ESTADÍSTICAS -->
<section class="grid g5" id="stats"></section>
<!-- TASA DE RESOLUCIÓN -->
<section class="banner"><small style="color:#bae6fd">Tasa de Resolución General</small><h2 id="tasa"></h2><span id="tasaTxt"></span></section>
<!-- FILTROS -->
<div class="filters"><input id="q" placeholder="Buscar cita, cliente, técnico..."><select id="fe"></select><select id="ftec"></select><small id="cnt"></small></div>
<!-- TABLA GLOBAL -->
<section class="card scroll"><h3>Todas las Citas de Mantenimiento</h3><p>Registro completo con técnicos y estado de resolución</p><table class="tbl"><thead><tr><th>ID</th><th>Cliente</th><th>Equipo</th><th>Tipo</th><th>Técnico</th><th>Fecha / Hora</th><th>Estado</th><th>Error Resuelto</th></tr></thead><tbody id="tbody"></tbody></table></section>
</main>
<!-- VENTANA MODAL (formularios) -->
<div id="modal" class="modal"></div>
<!-- AVISO EMERGENTE -->
<div id="toast"></div>
<script src="js/app.js"></script>
</body>
</html>
