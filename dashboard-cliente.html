<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Dashboard - NetService Pro</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="dashboard-cliente" data-rol="cliente">
<!-- BARRA SUPERIOR (la genera js/app.js) -->
<header id="topbar"></header>
<!-- CONTENIDO PRINCIPAL -->
<main class="wrap">
<!-- ESTADÍSTICAS -->
<section class="grid g4" id="stats"></section>
<section class="cols" style="grid-template-columns:1fr 2fr">
  <!-- GRÁFICA DE ESTADO -->
  <div class="card"><h3>Estado de Mis Solicitudes</h3><p>Distribución actual</p><div class="donut" id="donut"></div><div id="leg"></div></div>
  <!-- CITAS RECIENTES -->
  <div class="card"><h3>Mis Citas Recientes</h3><p>Últimas solicitudes de mantenimiento</p><table class="tbl"><thead><tr><th>Equipo</th><th>Fecha</th><th>Estado</th><th>Resuelto</th></tr></thead><tbody id="tbody"></tbody></table><a class="btn full" style="margin-top:12px" href="mis-citas.html">Ver todas mis citas</a></div>
</section>
</main>
<!-- VENTANA MODAL (formularios) -->
<div id="modal" class="modal"></div>
<!-- AVISO EMERGENTE -->
<div id="toast"></div>
<script src="js/app.js"></script>
</body>
</html>
