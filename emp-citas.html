<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Citas - NetService Pro</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/emp-citas.css">
</head>
<body data-page="emp-citas" data-rol="empleado">
<div class="layout">
  <!-- MENÚ LATERAL (lo genera js/empleado.js) -->
  <aside class="side" id="side"></aside>
  <!-- CONTENIDO -->
  <main class="content">
    <!-- ENCABEZADO -->
    <div class="tophead"><div><h1>Citas</h1><small>Elige citas, sigue tu trabajo y envía tus reportes</small></div><button class="btn" id="nuevoRep">+ Nuevo reporte</button></div>
    <!-- PESTAÑAS -->
    <div class="pest"><button data-t="disp" class="on">Disponibles</button><button data-t="mis">Mis citas</button><button data-t="rep">Reportes</button></div>
    <!-- LISTADO (cambia según la pestaña) -->
    <section id="lista"></section>
  </main>
</div>
<!-- MODAL Y AVISO -->
<div id="modal" class="modal"></div><div id="toast"></div>
<script src="js/app.js"></script>
<script src="js/empleado.js"></script>
</body>
</html>
