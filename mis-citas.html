<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mis Citas - NetService Pro</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="mis-citas" data-rol="cliente">
<!-- BARRA SUPERIOR (la genera js/app.js) -->
<header id="topbar"></header>
<!-- CONTENIDO PRINCIPAL -->
<main class="wrap">
<!-- ESTADÍSTICAS -->
<section class="grid g4" id="stats"></section>
<!-- TABLA HISTORIAL DE CITAS -->
<section class="card"><h3>Historial de Citas</h3><div class="scroll"><table class="tbl"><thead><tr><th>ID</th><th>Equipo</th><th>Tipo</th><th>Fecha / Hora</th><th>Técnico</th><th>Estado</th><th>Error Resuelto</th></tr></thead><tbody id="tbody"></tbody></table></div></section>
<!-- VISITA TÉCNICA EN CURSO -->
<section class="card s-az" style="margin-top:18px" id="curso"></section>
</main>
<!-- VENTANA MODAL (formularios) -->
<div id="modal" class="modal"></div>
<!-- AVISO EMERGENTE -->
<div id="toast"></div>
<script src="js/app.js"></script>
</body>
</html>
